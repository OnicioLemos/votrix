<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votrix · Cadastro</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230A0E1A%27/%3E%3Cpath d=%27M9 9l14 14M23 9L9 23%27 stroke=%27%2322D3EE%27 stroke-width=%273.5%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="tela-acesso">
    <div class="caixa-acesso">
      <span class="logo logo-grande">VOTRI<span>X</span></span>
      <p class="subtitulo">Crie seu acesso para votar. Um voto por CPF.</p>

      <div class="card">
        <div id="alerta" class="oculto" role="alert"></div>

        <form id="formCadastro" novalidate>
          <div class="campo">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" autocomplete="name" maxlength="100" required>
          </div>
          <div class="campo">
            <label for="cpf">CPF</label>
            <input id="cpf" name="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required>
          </div>
          <div class="campo">
            <label for="senha">Senha (mínimo 6 caracteres)</label>
            <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="6" required>
          </div>
          <div class="campo">
            <label for="confirmar">Confirme a senha</label>
            <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" required>
          </div>
          <button class="btn btn-primario btn-bloco" type="submit" id="btnCadastrar">Cadastrar e votar</button>
        </form>
      </div>

      <p class="rodape-acesso">Já tem cadastro? <a href="index.html">Entrar</a></p>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
